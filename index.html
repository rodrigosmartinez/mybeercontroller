<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>MyBeerController - Firebase</title>

<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/charts/loader.js"></script>


</head>


<body>


<h1>🍺 MyBeerController - Firebase</h1>


<div class="container">


<div class="cards">


<div class="card">
<div>Status</div>
<div id="status_control" class="value">--</div>
</div>


<div class="card">
<div>Setpoint</div>
<input id="setpoint" class="input-card">
</div>


<div class="card">
<div>Temp. Interna</div>
<input id="temp_in" class="input-card">
</div>


<div class="card">
<div>Temp. Externa</div>
<input id="temp_out" class="input-card">
</div>

  
<div class="card">
<div>Histerese</div>
<input id="hysterese" class="input-card">
</div>


<div class="card">
<div>Delay</div>
<input id="timedelay" class="input-card">
</div>


<div class="card">
<div>On Time</div>
<input id="ontime" class="input-card">
</div>


<div class="card">
<div>Off Time</div>
<input id="offtime" class="input-card">
</div>


<div class="card">
<div>Stirrer</div>
<input id="stirrer" class="input-card">
</div>


</div>



<button onclick="enviarParametros()">
Enviar
</button>



<div id="chart_div"></div>



<div class="info-section">

<img src="img/logo.png">

<div class="info-text">

<h2>Controle de fermentação</h2>

<p>
Sistema baseado em ESP32 com Firebase,
monitoramento remoto em tempo real.
</p>

</div>

</div>



<div id="footer">
MyBeerController © 2026
</div>


</div>



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


<script src="js/firebase.js"></script>

<script src="js/chart.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/commands.js"></script>


</body>

</html>
